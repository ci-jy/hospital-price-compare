[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-price-compare"
version = "0.1.0"
description = "Turns hospital price-transparency files into comparable negotiated rates by payer and service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "ijson>=3.2",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hpc = "hpc.cli:main"

[tool.setuptools]
packages = ["hpc", "hpc.ingest"]

[tool.setuptools.package-data]
hpc = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
